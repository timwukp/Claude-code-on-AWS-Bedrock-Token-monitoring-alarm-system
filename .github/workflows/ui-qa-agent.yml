name: UI QA Agent (AgentCore)

# Developer pushes code → CI/CD triggers → UI Test Agent → Test Report → Bug-Fix Agent → PR
#
# On a PR touching the frontend, an AgentCore Harness logs into the deployed site, explores
# every page, and reports findings. If it finds blocking bugs, a second Harness (Bug-Fix Agent)
# root-causes them against the repo source, patches, and pushes the fix onto the PR branch —
# which re-triggers this workflow, closing the loop until the QA run is green.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/lambdas/api/**'
      - '.github/workflows/ui-qa-agent.yml'
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL to test'
        required: true
        default: 'https://your-app.example.com/'

# One qa run per PR at a time, latest commit wins. Two pushes 29 s apart on #64 ran concurrently
# against the same site and harness: one run was terminated mid-exploration, the other's invoke
# returned an empty stream. Cancelling the superseded run is also what the check's colour assumes —
# it reports the newest commit, so only the newest commit's run should exist.
concurrency:
  group: ui-qa-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Trust boundary (feature-47, security audit #1): everything that runs with AWS credentials or a write
# token below is checked out from the PR's BASE branch. The PR's own code is only ever (a) built in a
# job with no permissions and no secrets, and (b) read as data by the agents. A PR can therefore not
# change this workflow, the agents, or the redactor for its own run.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  # Everything else (account id, harness ARNs, target URL, QA_RED_ON) is job-level on `inputs`
  # and `qa` only: the `build` job runs the PR's npm scripts and must inherit no secret.

jobs:
  # ── 1. Public build inputs (read with credentials, but they are public-by-design values) ──
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    outputs:
      api_url: ${{ steps.cfn.outputs.api_url }}
      user_pool_id: ${{ steps.cfn.outputs.user_pool_id }}
      client_id: ${{ steps.cfn.outputs.client_id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsUITestRole
          aws-region: ${{ env.AWS_REGION }}
      - id: cfn
        run: |
          # Vite bakes these in at build time (frontend/.env.example); they are already in the public bundle.
          echo "api_url=$(aws cloudformation describe-stacks --stack-name Tums-dev-Api --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(aws cloudformation describe-stacks --stack-name Tums-dev-Auth --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)" >> "$GITHUB_OUTPUT"
          echo "client_id=$(aws cloudformation describe-stacks --stack-name Tums-dev-Auth --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)" >> "$GITHUB_OUTPUT"

  # ── 2. Build the PR's frontend with NO permissions and NO secrets ─────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: inputs
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      - name: Build
        env:
          VITE_API_URL: ${{ needs.inputs.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ needs.inputs.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ needs.inputs.outputs.client_id }}
          VITE_AWS_REGION: ${{ env.AWS_REGION }}
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist/
          retention-days: 1

  # ── 3. Deploy the artifact, run the agents (base-branch code), post results ─────────────
  qa:
    runs-on: ubuntu-latest
    needs: build
    # Must cover: deploy (~3-8m) + QA invoke (harness allows 60m) + structured pass + bugfix
    # (up to 30m). Sized for fable-5-class models that use their full thinking budget.
    timeout-minutes: 120
    permissions:
      id-token: write        # OIDC → assume the AWS role
      contents: write        # the auto-fix commit onto the PR branch (main is ruleset-protected: PR + checks required)
      pull-requests: write   # post the results comment
    env:
      # Account ID comes from a repo secret (Settings → Secrets → Actions → AWS_ACCOUNT_ID),
      # so no account number is committed to this public repo — which is true, and was not
      # enough. Being a secret masks it in the job LOG; it does not mask it in anything this
      # workflow POSTs to the GitHub API. The agents interpolate it into S3 URIs and then
      # narrate those URIs in their own output, so every string they produce is scrubbed by
      # .github/scripts/redact.js before it can reach a comment body. Read that file before
      # adding any step that publishes agent text.
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      # Harness names come from repo variables (Settings → Secrets and variables → Actions → Variables),
      # so no environment-specific resource ids are committed to this public repo.
      HARNESS_ARN: arn:aws:bedrock-agentcore:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:harness/${{ vars.UI_HARNESS }}
      BUGFIX_ARN: arn:aws:bedrock-agentcore:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:harness/${{ vars.BUGFIX_HARNESS }}
      TARGET_URL: ${{ vars.TARGET_URL }}
      # Absolute fuse only — the loop's real exits are goal-driven: green when the QA report has
      # no blocking findings, red early when two consecutive rounds make zero progress (nothing
      # FIXED and the blocking set not shrinking — the signature of a bug this loop cannot fix).
      MAX_FIX_ROUNDS: '15'
      # What makes this check red once the loop has stopped advancing (owner decision 2026-09-21).
      #   FAIL     = any finding at all reddens it — the report's own verdict, LOW nits included.
      #   BLOCKING = only CRITICAL/HIGH/MEDIUM redden it; LOW findings annotate but pass.
      # FAIL is the default because the failure it prevents was real and repeated: #51, #52 and #53
      # each ended GREEN while their report said `overall: FAIL`, so six green checks invited a merge
      # of a failing report. Switching to BLOCKING is a one-word change here, nothing else.
      QA_RED_ON: FAIL
    steps:
      # Trusted tooling: ci-agent/, .github/scripts/, .sdlc/ from the BASE branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      # The PR tree, as data for the bug-fix agent to patch and push. Never executed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          path: pr
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }

      - run: pip install boto3==1.43.120  # pinned (feature-47); bedrock-agentcore invoke_harness needs a release after 1.40
        working-directory: ci-agent

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsUITestRole
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: pr-dist

      # ── Deploy this branch's frontend to the dev site (closes the fix→re-test loop) ──
      # The Bug-Fix Agent patches SOURCE; the QA agent tests the LIVE site. Without this
      # step, a re-triggered run would re-test the old deployment and the loop could never
      # converge (same findings every round until MAX_FIX_ROUNDS burns out).
      - name: Deploy frontend for this branch
        id: deploy
        run: |
          STACK="Tums-dev-Frontend"
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          test -f pr-dist/index.html || { echo "::error::build artifact missing index.html"; exit 1; }
          aws s3 sync pr-dist "s3://$BUCKET" --delete --exclude "*.map"
          INV_ID=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Waiting for CloudFront invalidation $INV_ID…"
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$INV_ID"
          echo "Deployed branch to live site; QA will test THIS code."

      # ── UI Test Agent → Test Report ─────────────────────────────────────────
      - name: Run UI QA Agent
        id: qa
        continue-on-error: true
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `set -o pipefail` so a non-zero qa_agent exit isn't masked by `tee`. The agent also
          # writes blocking=/findings= to $GITHUB_OUTPUT, which is what the Bug-Fix stage gates on.
          set -o pipefail
          # Reconciliation: if a previous round left a report in S3, fetch it so the agent
          # explicitly re-verifies each prior finding (FIXED / STILL_FAILING) besides exploring.
          aws s3 cp "s3://token-monitor-qa-reports-${AWS_ACCOUNT_ID}/pr-${PR_NUMBER:-manual}/test-report-latest.json" \
            prior-report.json 2>/dev/null || echo '{}' > prior-report.json
          python ci-agent/qa_agent.py \
            --harness-arn "$HARNESS_ARN" \
            --url "${INPUT_URL:-$TARGET_URL}" \
            --run-prefix "pr-${PR_NUMBER:-manual}" \
            --prior-report prior-report.json \
            --out qa-report.json | tee qa-output.txt

      # ── Guard: how many auto-fix rounds have already run on this branch? ─────
      - name: Count prior fix rounds
        id: rounds
        env:
          # base_ref is only set for pull_request events; empty on workflow_dispatch.
          BASE_REF: ${{ github.base_ref }}
        working-directory: pr
        run: |
          # Count auto-fix commits since the base. On manual dispatch there is no base_ref,
          # so fall back to counting across the whole branch history. Always emit an integer
          # (never empty) so the downstream fromJSON() comparison can't fail.
          if [ -n "$BASE_REF" ] && git rev-parse --verify -q "origin/$BASE_REF" >/dev/null; then
            range="origin/$BASE_REF..HEAD"
          else
            range="HEAD"
          fi
          n=$(git log --oneline "$range" 2>/dev/null \
              | grep -c 'chore(agent): auto-fix round' || true)
          n=${n:-0}
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Prior auto-fix rounds on this branch: $n"

      # ── Zero-progress circuit breaker ────────────────────────────────────────
      # A round that fixes nothing AND doesn't shrink the blocking set is a stall. Two stalls
      # in a row means the remaining findings aren't fixable by patching this repo (env/data/
      # judgment issues) — stop burning rounds and hand off to a human immediately.
      - name: Track convergence
        id: stall
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROGRESS: ${{ steps.qa.outputs.progress }}
        run: |
          KEY="pr-${PR_NUMBER:-manual}/stall-count.txt"
          prev=$(aws s3 cp "s3://token-monitor-qa-reports-${AWS_ACCOUNT_ID}/${KEY}" - 2>/dev/null || echo 0)
          prev=${prev:-0}
          if [ "$PROGRESS" = "false" ]; then n=$((prev + 1)); else n=0; fi
          echo "$n" | aws s3 cp - "s3://token-monitor-qa-reports-${AWS_ACCOUNT_ID}/${KEY}"
          echo "stalls=$n" >> "$GITHUB_OUTPUT"
          echo "Consecutive zero-progress rounds: $n"

      # ── Bug-Fix Agent → patch → push (re-triggers this workflow) ─────────────
      - name: Run Bug-Fix Agent and push fix
        id: fix
        if: >-
          github.event_name == 'pull_request' &&
          steps.qa.outputs.blocking == 'true' &&
          fromJSON(steps.rounds.outputs.count) < fromJSON(env.MAX_FIX_ROUNDS) &&
          fromJSON(steps.stall.outputs.stalls) < 2
        env:
          # Route dynamic refs through env to avoid script injection (actionlint expression check).
          PRIOR_ROUNDS: ${{ steps.rounds.outputs.count }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # The agent (base-branch code) patches the PR checkout under pr/ — never this workspace,
          # which holds the trusted tooling. Its diff is confined to the one file it was asked about
          # (bugfix_agent.diff_is_confined) and protected paths are refused outright.
          python ci-agent/bugfix_agent.py \
            --report qa-report.json \
            --harness-arn "$BUGFIX_ARN" \
            --repo-root pr \
            --plan-root . \
            --out bugfix-summary.md \
            --patched-list bugfix-patched.txt
          cd pr
          # Stage exactly the files the agent patched — nothing else. A directory-scoped
          # `git add -- backend frontend infra` also swept in anything else dirty in the runner
          # tree, and the agent now refuses files the active plan doesn't name, so honouring that
          # refusal at the commit step too means one list governs both (rule (b)). The list is the
          # only authority here — no second hardcoded path allowlist, which could only disagree
          # with the plan. A listed path that does not exist is an agent bug and fails loudly:
          # swallowing it would make a broken patch read as "no applicable source patch".
          if [ -s ../bugfix-patched.txt ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                .github/*|.sdlc/*|ci-agent/*|infra/*|intent/*|spec/*|scripts/*|.claude/*)
                  echo "::error::Bug-Fix Agent listed a protected path: $file"; exit 1;;
              esac
              if [ ! -f "$file" ]; then
                echo "::error::Bug-Fix Agent listed a path it did not leave on disk: $file"
                exit 1
              fi
              git add -- "$file"
            done < ../bugfix-patched.txt
          fi
          if ! git diff --cached --quiet; then
            round=$(( PRIOR_ROUNDS + 1 ))
            git config user.name  "agentcore-bugfix[bot]"
            git config user.email "agentcore-bugfix@users.noreply.github.com"
            git commit -m "chore(agent): auto-fix round $round — from UI QA findings"
            git push origin "HEAD:$HEAD_REF"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Pushed auto-fix round $round; workflow will re-trigger."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Bug-Fix Agent produced no applicable source patch."
          fi

      # ── Keep the diagnostics, redacted ───────────────────────────────────────
      # The report and the agents' stdout are what a reviewer needs when the check is red, and
      # the PR comment truncates them. But artifacts are NOT log-masked and this repo is public:
      # the agents narrate S3 URIs carrying the account id. So every file goes through the same
      # redactor the comment uses, and a file that still matches a secret pattern afterwards is
      # withheld rather than uploaded (see .github/scripts/redact.js).
      - name: Redact QA diagnostics
        if: always()
        # redact.js is the BASE branch's copy (this workspace is the base checkout); the PR tree lives under pr/.
        run: |
          mkdir -p qa-diag
          node - <<'JS'
            const fs = require('fs');
            const { redact, findSecrets } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/redact.js`);
            for (const f of ['qa-report.json', 'qa-output.txt', 'bugfix-summary.md', 'bugfix-patched.txt']) {
              if (!fs.existsSync(f)) continue;
              const body = redact(fs.readFileSync(f, 'utf8'));
              const left = findSecrets(body);
              if (left.length) {
                console.log(`::warning::${f} still matched ${left.map(r => r.label).join(', ')} after redaction - withheld from the artifact`);
                continue;
              }
              fs.writeFileSync(`qa-diag/${f}`, body);
            }
          JS
          ls -l qa-diag || true

      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-qa-${{ github.run_id }}
          path: qa-diag/
          if-no-files-found: ignore
          retention-days: 14

      # ── Post results / loop status onto the PR ───────────────────────────────
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # Pass dynamic values through env (not inline ${{ }}) to avoid expression-injection
          # and unsupported operators in the script interpolation.
          ROUNDS: ${{ steps.rounds.outputs.count }}
          INPUT_URL: ${{ github.event.inputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            // Every string this step interpolates is written by a remote agent, and a body
            // POSTed from here never passes GitHub's log-masking filter. See
            // .github/scripts/redact.js for the incident this guards against.
            const { redact, findSecrets } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/redact.js`);
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
            let report = {};
            try { report = JSON.parse(read('qa-report.json')); } catch {}
            const findings = report.findings || [];
            const rounds = Number(process.env.ROUNDS || '0');
            const target = process.env.INPUT_URL || process.env.TARGET_URL || 'n/a';
            const prNum = process.env.PR_NUMBER || 'manual';
            const bugfix = read('bugfix-summary.md');
            const icon = (report.overall === 'PASS' || findings.length === 0) ? '✅' : '❌';
            const rows = findings.map(f =>
              `| ${f.severity} | ${f.page} | ${f.summary} |`).join('\n');
            const rec = report.reconciliation || [];
            const recRows = rec.map(r =>
              `| ${r.id} | ${r.summary} | ${r.status === 'FIXED' ? '✅ FIXED' : '❌ ' + (r.status || 'STILL_FAILING')} |`).join('\n');
            const recBlock = rec.length
              ? `\n### 🔁 Prior findings re-verified\n| ID | Finding | Status |\n|---|---|---|\n${recRows}`
              : '';
            const header = [
              `## ${icon} UI QA Agent — ${findings.length} finding(s)`,
              `**Target:** \`${target}\` · **Overall:** ${report.overall || 'n/a'} · **Auto-fix rounds:** ${rounds}`,
              findings.length ? `\n| Severity | Page | Finding |\n|---|---|---|\n${rows}` : '\nNo blocking issues found. 🎉',
              recBlock,
            ].join('\n');
            const detail = [
              bugfix ? `\n<details><summary>🔧 Bug-Fix Agent</summary>\n\n${bugfix}\n</details>` : '',
              `\n<details><summary>Full agent output</summary>\n\n\`\`\`\n${read('qa-output.txt').slice(-3000)}\n\`\`\`\n</details>`,
            ].join('\n');
            const footer =
              `\n---\n*Powered by [AgentCore Harness](https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html) — UI Test Agent + Bug-Fix Agent · screenshots in S3 \`pr-${prNum}/\`*`;

            // One choke point, then an assertion on the FINAL string. Calling a redactor
            // is not the control; proving the posted body is clean is. Each fallback drops
            // the dirtiest section rather than posting it, and the last one cannot be dirty
            // because it interpolates nothing an agent wrote.
            let body = redact(header + detail + footer);
            let residue = findSecrets(body);
            if (residue.length) {
              core.warning(`Redaction left ${residue.map(r => r.label).join(', ')} in the ` +
                `agent-output sections — withholding them from the PR comment.`);
              body = redact(header) +
                `\n\n> ⚠️ The agent-output sections were withheld: they still matched a ` +
                `secret pattern after redaction. Read the (log-masked) job output instead.` +
                footer;
              residue = findSecrets(body);
            }
            if (residue.length) {
              core.error(`Redaction left ${residue.map(r => r.label).join(', ')} in the ` +
                `findings table itself — posting a header only.`);
              body = `## ${icon} UI QA Agent — ${findings.length} finding(s)\n\n` +
                `> ⚠️ This comment was reduced to its header: the agent's own text still ` +
                `matched a secret pattern after redaction. Read the (log-masked) job output.`;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, body,
            });

      - name: Fail check if the loop stalled (zero progress twice)
        if: steps.qa.outputs.blocking == 'true' && fromJSON(steps.stall.outputs.stalls) >= 2
        run: |
          echo "::error::Loop stalled - two consecutive rounds with nothing FIXED and no shrink in blocking findings. Remaining issues likely are not fixable by patching this repo (env/config/data). Needs human review."
          exit 1

      - name: Fail check if the fuse blew (absolute round cap)
        if: steps.qa.outputs.blocking == 'true' && fromJSON(steps.rounds.outputs.count) >= fromJSON(env.MAX_FIX_ROUNDS)
        run: |
          echo "::error::UI QA still failing after $MAX_FIX_ROUNDS auto-fix rounds (absolute fuse) - needs human review."
          exit 1

      # ── The check's colour must match the report's verdict ───────────────────
      # The QA step runs under continue-on-error, because a non-zero exit there must not abort
      # the fix loop. The consequence was that nothing ever read its verdict back: whenever the
      # bot pushed no patch and the stall counter had not yet reached 2, a report saying
      # `overall: FAIL` ended the run GREEN. #51, #52 and #53 each reached "all checks passed"
      # that way. Only runs that END the loop are judged here — if a fix was pushed, the
      # re-triggered run renders the verdict instead.
      - name: Fail check if the QA report is not clean
        if: steps.fix.outputs.pushed != 'true'
        env:
          OVERALL: ${{ steps.qa.outputs.overall }}
          BLOCKING: ${{ steps.qa.outputs.blocking }}
          FINDINGS: ${{ steps.qa.outputs.findings }}
        run: |
          if [ -z "$OVERALL" ] || [ "$OVERALL" = "UNKNOWN" ]; then
            echo "::error::UI QA produced no parseable verdict (overall='${OVERALL}'). Treating as failure - read the job output."
            exit 1
          fi
          if [ "$QA_RED_ON" = "BLOCKING" ]; then
            if [ "$BLOCKING" = "true" ]; then
              echo "::error::UI QA has blocking findings and no fix was pushed - the loop has stopped. Read the PR comment."
              exit 1
            fi
            if [ "$OVERALL" = "FAIL" ]; then
              echo "::warning::UI QA report is FAIL with ${FINDINGS:-?} non-blocking finding(s); QA_RED_ON=BLOCKING, so this check stays green."
            fi
            exit 0
          fi
          if [ "$OVERALL" = "FAIL" ] || [ "$BLOCKING" = "true" ]; then
            echo "::error::UI QA report says overall=$OVERALL blocking=$BLOCKING with ${FINDINGS:-?} finding(s) and no fix was pushed - the loop has stopped. Read the PR comment for the findings."
            exit 1
          fi
          echo "UI QA report is clean (overall=$OVERALL)."

      - name: Converged - clear loop state
        if: steps.qa.outputs.blocking != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          aws s3 rm "s3://token-monitor-qa-reports-${AWS_ACCOUNT_ID}/pr-${PR_NUMBER:-manual}/stall-count.txt" 2>/dev/null || true
          echo "QA green - no blocking findings. Loop converged."
