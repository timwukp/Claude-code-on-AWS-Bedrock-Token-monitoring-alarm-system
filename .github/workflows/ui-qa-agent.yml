name: UI QA Agent (AgentCore)

# Developer pushes code → CI/CD triggers → UI Test Agent → Test Report → Bug-Fix Agent → PR
#
# On a PR touching the frontend, an AgentCore Harness logs into the deployed site, explores
# every page, and reports findings. If it finds blocking bugs, a second Harness (Bug-Fix Agent)
# root-causes them against the repo source, patches, and pushes the fix onto the PR branch —
# which re-triggers this workflow, closing the loop until the QA run is green.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/lambdas/api/**'
      - '.github/workflows/ui-qa-agent.yml'
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL to test'
        required: true
        default: 'https://your-app.example.com/'

permissions:
  id-token: write        # OIDC → assume the AWS role
  contents: write        # push the auto-fix commit onto the PR branch
  pull-requests: write   # post the results comment

env:
  AWS_REGION: us-east-1
  # Account ID comes from a repo secret (Settings → Secrets → Actions → AWS_ACCOUNT_ID),
  # so no account number is committed to this public repo.
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  # Harness names come from repo variables (Settings → Secrets and variables → Actions → Variables),
  # so no environment-specific resource ids are committed to this public repo.
  HARNESS_ARN: arn:aws:bedrock-agentcore:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:harness/${{ vars.UI_HARNESS }}
  BUGFIX_ARN: arn:aws:bedrock-agentcore:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:harness/${{ vars.BUGFIX_HARNESS }}
  TARGET_URL: ${{ vars.TARGET_URL }}
  # Absolute fuse only — the loop's real exits are goal-driven: green when the QA report has
  # no blocking findings, red early when two consecutive rounds make zero progress (nothing
  # FIXED and the blocking set not shrinking — the signature of a bug this loop cannot fix).
  MAX_FIX_ROUNDS: '10'

jobs:
  qa:
    runs-on: ubuntu-latest
    # Must cover: deploy (~3-8m) + QA invoke (harness allows 60m) + structured pass + bugfix
    # (up to 30m). Sized for fable-5-class models that use their full thinking budget.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install boto3
        working-directory: ci-agent

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsUITestRole
          aws-region: ${{ env.AWS_REGION }}

      # ── Deploy this branch's frontend to the dev site (closes the fix→re-test loop) ──
      # The Bug-Fix Agent patches SOURCE; the QA agent tests the LIVE site. Without this
      # step, a re-triggered run would re-test the old deployment and the loop could never
      # converge (same findings every round until MAX_FIX_ROUNDS burns out).
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Deploy frontend for this branch
        id: deploy
        run: |
          STACK="Tums-dev-Frontend"
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          # Vite bakes these in at build time (frontend/.env.example) — without them the bundle
          # ships userPoolId=undefined and login breaks for everyone, not just the QA agent.
          export VITE_API_URL=$(aws cloudformation describe-stacks --stack-name "Tums-dev-Api" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          export VITE_COGNITO_USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name "Tums-dev-Auth" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          export VITE_COGNITO_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name "Tums-dev-Auth" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          export VITE_AWS_REGION="$AWS_REGION"
          ( cd frontend && npm ci && npm run build )
          aws s3 sync frontend/dist "s3://$BUCKET" --delete
          INV_ID=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Waiting for CloudFront invalidation $INV_ID…"
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$INV_ID"
          echo "Deployed branch to live site; QA will test THIS code."

      # ── UI Test Agent → Test Report ─────────────────────────────────────────
      - name: Run UI QA Agent
        id: qa
        continue-on-error: true
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `set -o pipefail` so a non-zero qa_agent exit isn't masked by `tee`. The agent also
          # writes blocking=/findings= to $GITHUB_OUTPUT, which is what the Bug-Fix stage gates on.
          set -o pipefail
          # Reconciliation: if a previous round left a report in S3, fetch it so the agent
          # explicitly re-verifies each prior finding (FIXED / STILL_FAILING) besides exploring.
          aws s3 cp "s3://token-monitor-qa-reports-${AWS_ACCOUNT_ID}/pr-${PR_NUMBER:-manual}/test-report-latest.json" \
            prior-report.json 2>/dev/null || echo '{}' > prior-report.json
          python ci-agent/qa_agent.py \
            --harness-arn "$HARNESS_ARN" \
            --url "${INPUT_URL:-$TARGET_URL}" \
            --run-prefix "pr-${PR_NUMBER:-manual}" \
            --prior-report prior-report.json \
            --out qa-report.json | tee qa-output.txt

      # ── Guard: how many auto-fix rounds have already run on this branch? ─────
      - name: Count prior fix rounds
        id: rounds
        env:
          # base_ref is only set for pull_request events; empty on workflow_dispatch.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Count auto-fix commits since the base. On manual dispatch there is no base_ref,
          # so fall back to counting across the whole branch history. Always emit an integer
          # (never empty) so the downstream fromJSON() comparison can't fail.
          if [ -n "$BASE_REF" ] && git rev-parse --verify -q "origin/$BASE_REF" >/dev/null; then
            range="origin/$BASE_REF..HEAD"
          else
            range="HEAD"
          fi
          n=$(git log --oneline "$range" 2>/dev/null \
              | grep -c 'chore(agent): auto-fix round' || true)
          n=${n:-0}
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Prior auto-fix rounds on this branch: $n"

      # ── Zero-progress circuit breaker ────────────────────────────────────────
      # A round that fixes nothing AND doesn't shrink the blocking set is a stall. Two stalls
      # in a row means the remaining findings aren't fixable by patching this repo (env/data/
      # judgment issues) — stop burning rounds and hand off to a human immediately.
      - name: Track convergence
        id: stall
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROGRESS: ${{ steps.qa.outputs.progress }}
        run: |
          KEY="pr-${PR_NUMBER:-manual}/stall-count.txt"
          prev=$(aws s3 cp "s3://token-monitor-qa-reports-${AWS_ACCOUNT_ID}/${KEY}" - 2>/dev/null || echo 0)
          prev=${prev:-0}
          if [ "$PROGRESS" = "false" ]; then n=$((prev + 1)); else n=0; fi
          echo "$n" | aws s3 cp - "s3://token-monitor-qa-reports-${AWS_ACCOUNT_ID}/${KEY}"
          echo "stalls=$n" >> "$GITHUB_OUTPUT"
          echo "Consecutive zero-progress rounds: $n"

      # ── Bug-Fix Agent → patch → push (re-triggers this workflow) ─────────────
      - name: Run Bug-Fix Agent and push fix
        if: >-
          steps.qa.outputs.blocking == 'true' &&
          fromJSON(steps.rounds.outputs.count) < fromJSON(env.MAX_FIX_ROUNDS) &&
          fromJSON(steps.stall.outputs.stalls) < 2
        env:
          # Route dynamic refs through env to avoid script injection (actionlint expression check).
          PRIOR_ROUNDS: ${{ steps.rounds.outputs.count }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python ci-agent/bugfix_agent.py \
            --report qa-report.json \
            --harness-arn "$BUGFIX_ARN" \
            --repo-root . \
            --out bugfix-summary.md
          # Only commit source the agent patched — never the CI run artifacts
          # (qa-report.json, qa-output.txt, bugfix-summary.md) sitting in the workdir.
          git add -- backend frontend infra 2>/dev/null || true
          if ! git diff --cached --quiet; then
            round=$(( PRIOR_ROUNDS + 1 ))
            git config user.name  "agentcore-bugfix[bot]"
            git config user.email "agentcore-bugfix@users.noreply.github.com"
            git commit -m "chore(agent): auto-fix round $round — from UI QA findings"
            git push origin "HEAD:$HEAD_REF"
            echo "Pushed auto-fix round $round; workflow will re-trigger."
          else
            echo "Bug-Fix Agent produced no applicable source patch."
          fi

      # ── Post results / loop status onto the PR ───────────────────────────────
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          # Pass dynamic values through env (not inline ${{ }}) to avoid expression-injection
          # and unsupported operators in the script interpolation.
          ROUNDS: ${{ steps.rounds.outputs.count }}
          INPUT_URL: ${{ github.event.inputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
            let report = {};
            try { report = JSON.parse(read('qa-report.json')); } catch {}
            const findings = report.findings || [];
            const rounds = Number(process.env.ROUNDS || '0');
            const target = process.env.INPUT_URL || process.env.TARGET_URL || 'n/a';
            const prNum = process.env.PR_NUMBER || 'manual';
            const bugfix = read('bugfix-summary.md');
            const icon = (report.overall === 'PASS' || findings.length === 0) ? '✅' : '❌';
            const rows = findings.map(f =>
              `| ${f.severity} | ${f.page} | ${f.summary} |`).join('\n');
            const rec = report.reconciliation || [];
            const recRows = rec.map(r =>
              `| ${r.id} | ${r.summary} | ${r.status === 'FIXED' ? '✅ FIXED' : '❌ ' + (r.status || 'STILL_FAILING')} |`).join('\n');
            const recBlock = rec.length
              ? `\n### 🔁 Prior findings re-verified\n| ID | Finding | Status |\n|---|---|---|\n${recRows}`
              : '';
            const body = [
              `## ${icon} UI QA Agent — ${findings.length} finding(s)`,
              `**Target:** \`${target}\` · **Overall:** ${report.overall || 'n/a'} · **Auto-fix rounds:** ${rounds}`,
              findings.length ? `\n| Severity | Page | Finding |\n|---|---|---|\n${rows}` : '\nNo blocking issues found. 🎉',
              recBlock,
              bugfix ? `\n<details><summary>🔧 Bug-Fix Agent</summary>\n\n${bugfix}\n</details>` : '',
              `\n<details><summary>Full agent output</summary>\n\n\`\`\`\n${read('qa-output.txt').slice(-3000)}\n\`\`\`\n</details>`,
              `\n---\n*Powered by [AgentCore Harness](https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html) — UI Test Agent + Bug-Fix Agent · screenshots in S3 \`pr-${prNum}/\`*`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, body,
            });

      - name: Fail check if the loop stalled (zero progress twice)
        if: steps.qa.outputs.blocking == 'true' && fromJSON(steps.stall.outputs.stalls) >= 2
        run: |
          echo "::error::Loop stalled - two consecutive rounds with nothing FIXED and no shrink in blocking findings. Remaining issues likely are not fixable by patching this repo (env/config/data). Needs human review."
          exit 1

      - name: Fail check if the fuse blew (absolute round cap)
        if: steps.qa.outputs.blocking == 'true' && fromJSON(steps.rounds.outputs.count) >= fromJSON(env.MAX_FIX_ROUNDS)
        run: |
          echo "::error::UI QA still failing after $MAX_FIX_ROUNDS auto-fix rounds (absolute fuse) - needs human review."
          exit 1

      - name: Converged - clear loop state
        if: steps.qa.outputs.blocking != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          aws s3 rm "s3://token-monitor-qa-reports-${AWS_ACCOUNT_ID}/pr-${PR_NUMBER:-manual}/stall-count.txt" 2>/dev/null || true
          echo "QA green - no blocking findings. Loop converged."
