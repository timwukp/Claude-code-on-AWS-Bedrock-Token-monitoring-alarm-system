name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      # Lambda bundling (NodejsFunction) runs esbuild from the backend package during synth,
      # so the backend deps must be installed too — not just infra's.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: infra
      - run: npm run build
        working-directory: infra
      - run: npm test                          # CDK assertions (infra/test), synthesised with ci.json
        working-directory: infra
      - run: npx cdk synth --context env=ci   # uses tracked placeholder config (no secrets)
        working-directory: infra

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
      - run: python3 -m unittest test_etl     # Fargate ETL pure logic, stdlib only
        working-directory: backend/analysis
      - run: python3 -m unittest test_agents  # CI agents' pure logic (verdict rule, diff confinement), stdlib only
        working-directory: ci-agent

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
