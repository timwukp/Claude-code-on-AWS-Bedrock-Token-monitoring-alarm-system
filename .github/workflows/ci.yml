name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Lambda bundling (NodejsFunction) runs esbuild from the backend package during synth,
      # so the backend deps must be installed too — not just infra's.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: infra
      - run: npm run build
        working-directory: infra
      - run: npx cdk synth --context env=ci   # uses tracked placeholder config (no secrets)
        working-directory: infra

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
